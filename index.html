<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#FBF8FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF8FC;--card:#fff;--tx:#1C1B1F;--mu:#7a7283;--pu:#B39DDB;--pud:#5b3f86;--pk:#F4B6C9;--ln:#ece4f3;--sh:0 8px 30px rgba(120,90,160,.09);--mint:#BFE6D4;--pe:#F9D5B8;--sky:#C4DDF2;color-scheme:light;
--sf:'Cormorant Garamond',Georgia,serif;--ss:Inter,system-ui,sans-serif}
:root[data-t=dark]{--bg:#17151a;--card:#221f27;--tx:#f1ecf5;--mu:#a79fb2;--pud:#cdb8ee;--ln:#383240;--sh:0 8px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--ss);padding:env(safe-area-inset-top,0) 0 0}
#app{max-width:560px;margin:0 auto;padding:20px 16px 150px}
h1,h2,h3,.sf{font-family:var(--sf);font-weight:500}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:20px;margin-bottom:18px;animation:in .4s both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.dark{background:linear-gradient(145deg,#1C1B1F,#3A2F45);color:#f6eefb}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#B39DDB,#F4B6C9);color:#fff;font:600 22px var(--sf);border:0;flex:none}
.hd h1{font-size:28px;line-height:1.1}.mu{color:var(--mu);font-size:13px}
.pill,.chip{border-radius:99px;padding:5px 12px;font-size:12.5px;background:var(--card);border:1px solid var(--ln);color:var(--mu);white-space:nowrap}
.pill{margin-left:auto;color:var(--pud)}.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.big{font-size:30px;line-height:1.15;margin:6px 0}
.bar{height:6px;border-radius:9px;background:rgba(150,130,180,.22);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pu),var(--pk));border-radius:9px;transition:width .8s}
input[type=range]{width:100%;accent-color:var(--pu)}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-top:4px}
label{display:block;font-size:12.5px;color:var(--mu);margin-bottom:10px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.b{background:var(--pud);color:#fff;border-radius:99px;padding:10px 18px}[data-t=dark] .b{color:#1C1B1F}
.g{background:transparent;border:1px solid var(--ln);border-radius:99px;padding:9px 16px}
.sm{padding:5px 11px;font-size:12.5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{margin-left:auto}
.seg{display:flex;gap:4px;background:var(--card);border-radius:99px;padding:4px;margin-bottom:18px;overflow-x:auto;box-shadow:var(--sh)}
.seg button{flex:1;padding:8px 12px;border-radius:99px;background:none;color:var(--mu);white-space:nowrap}.seg .on{background:var(--pu);color:#1C1B1F}
.it{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--ln)}.it:last-child{border:0}
.n{width:30px;height:30px;border-radius:50%;background:#EADFF7;color:var(--pud);display:grid;place-items:center;font:600 16px var(--sf);flex:none}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--pu);background:none;flex:none;margin-left:auto;display:grid;place-items:center;color:#fff;transition:.2s}
.ck.on{background:var(--pu);transform:scale(1.08)}
.tg{font-size:11px;border-radius:99px;padding:2px 9px;background:var(--pk);color:#1C1B1F;margin-right:4px}
.tg.i{background:var(--pe)}.tg.c{background:var(--mint)}.tg.w{background:var(--sky)}
.done{text-decoration:line-through;opacity:.5}
.q{font:italic 500 22px/1.3 var(--sf)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:110px;background:none;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}nav .on{color:var(--pud)}
#fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--pu),var(--pk));color:#1C1B1F;font-size:28px;box-shadow:var(--sh);z-index:6;transition:.3s}
#fm{position:fixed;right:18px;bottom:calc(146px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#fm button{background:var(--card);border-radius:99px;padding:8px 16px;box-shadow:var(--sh)}
.ov{position:fixed;inset:0;background:rgba(28,27,31,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:22px;max-height:88%;overflow:auto}
.sheet h3{font-size:26px;margin-bottom:10px}
.bc{width:150px;height:150px;border-radius:50%;margin:20px auto;background:radial-gradient(var(--pk),var(--pu));animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.6)}50%{transform:scale(1)}}
#sp{position:fixed;inset:0;background:linear-gradient(145deg,#1C1B1F,#3A2F45);color:#f6eefb;z-index:50;display:grid;place-content:center;text-align:center;transition:opacity 1s}
#sp h1{font-size:54px}#sp p{font:italic 22px var(--sf);color:#F4B6C9}
.cf{position:fixed;top:40%;width:8px;height:8px;border-radius:50%;z-index:60;animation:cf 1.4s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y));opacity:0}}
svg text{fill:var(--mu);font-size:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="sp"><h1 class="sf">Résiliente</h1><p>Your cracks are part of your gold.</p></div>
<div id="app"></div><div id="fm" hidden></div><button id="fab" aria-label="Quick add">+</button>
<nav id="nav"></nav><div id="md"></div>
<script>
/* ===== Résiliente — local-only personal app. All data lives in localStorage. ===== */
const K='resiliente.v1',A=document.getElementById('app'),M=document.getElementById('md');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TD=()=>ymd(new Date()),ago=n=>ymd(new Date(Date.now()-n*864e5)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID'),uid=()=>Math.random().toString(36).slice(2,9);
const EXP=['Food','Transport','Bills','Savings','Health','Fun','Work','Other'],INC=['Salary','Side income','Other (income)'];
/* ---- Curated quotes: [text, author, category]. Prose/speech/essay sources only. ---- */
const QS=[
['You may encounter many defeats, but you must not be defeated.','Maya Angelou','Strength'],
['Nothing can dim the light which shines from within.','Maya Angelou','Identity'],
['When we are no longer able to change a situation, we are challenged to change ourselves.','Viktor Frankl','Strength'],
['He who has a why to live can bear almost any how.','Friedrich Nietzsche (quoted by Viktor Frankl)','Purpose'],
['What stands in the way becomes the way.','Marcus Aurelius','Focus & Work'],
['Waste no more time arguing about what a good person should be. Be one.','Marcus Aurelius','Identity'],
['Nature does not hurry, yet everything is accomplished.','Lao Tzu','Calm'],
['A journey of a thousand miles begins with a single step.','Lao Tzu','Purpose'],
['Be patient toward all that is unsolved in your heart.','Rainer Maria Rilke','Healing'],
['Courage starts with showing up and letting ourselves be seen.','Brené Brown','Identity'],
['Caring for myself is not self-indulgence, it is self-preservation.','Audre Lorde','Healing'],
['We suffer more often in imagination than in reality.','Seneca','Calm'],
['Almost everything will work again if you unplug it for a few minutes, including you.','Anne Lamott','Calm'],
['Do what you can, with what you have, where you are.','Theodore Roosevelt','Focus & Work'],
['It is not what happens to you, but how you react to it that matters.','Epictetus','Strength'],
['He who knows he has enough is rich.','Lao Tzu','Calm']];
const AFF=['I am allowed to be unfinished and still be worthy.','My cracks are where my gold shows.','I can rest without earning it.','I do not have to carry everything today.','Small steps still count as steps.','I choose gentleness when I am tired.','My sensitivity is a strength I am learning to protect.','I can hold grief and hope at the same time.','What I repair, I make more beautiful.','I am becoming, and that is enough.'];
const quotes0=()=>[...QS.map(q=>({id:uid(),t:q[0],a:q[1],c:q[2]})),...AFF.map(t=>({id:uid(),t,a:'Original affirmation',c:'Affirmation'}))];
const seed=()=>({name:'',theme:'',energy:{},tasks:[
{id:uid(),t:'Finish bank reconciliation',p:'Urgent',c:'Work',due:ago(-2),s:1},{id:uid(),t:'Review monthly closing checklist',p:'Important',c:'Work',due:ago(-5),s:1},{id:uid(),t:'Take a slow walk after lunch',p:'Can wait',c:'Personal',due:'',s:1}],
notes:[{id:uid(),t:'Closing procedure',x:'Accruals first, then intercompany, then sign-off.',g:'procedure',pin:1,d:TD(),s:1}],dumps:[],journal:[],moods:[],focus:[],pages:[],money:[
{id:uid(),d:TD(),ty:'out',a:35000,c:'Food',n:'Lunch',s:1},{id:uid(),d:TD(),ty:'in',a:5000000,c:'Side income',n:'Freelance',s:1}],
habits:['Exercise','Reading','Drinking water','Journaling','Enough sleep'].map(n=>({id:uid(),n,log:[],days:0,s:1})),
goals:[{id:uid(),cat:'Learning',why:'Reading calms and feeds me.',t:'Read 12 books this year',due:ymd(new Date(new Date().getFullYear(),11,31)),ms:[{t:'Pick book #1',d:1},{t:'Read 20 pages a week',d:0}],notes:[],s:1}],
books:[{id:uid(),t:'Man’s Search for Meaning',tot:200,rd:40,q:[],s:1}],music:[],quotes:quotes0(),fav:[],
sched:[['06:30','08:30','Morning routine'],['09:00','12:00','Deep work'],['12:00','13:00','Lunch & rest'],['13:00','15:00','Meetings'],['15:00','17:30','Focus tasks'],['17:30','22:00','Wind down']],
who:{values:'Honesty, calm, growth, kindness to myself',vision:'A steady life with room for quiet, books, and movement.'},rev:{}});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.tasks)S=seed();
const ui={tab:'today',plan:'tasks',grow:'goals',wk:'week',mq:'All',ms:'',mf:'All',gd:'',hx:0};
let sv;function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}const p=document.getElementById('pl');if(p){p.textContent='Saved ✓';p.style.opacity=1;clearTimeout(sv);sv=setTimeout(()=>p.style.opacity=.5,1500)}}
const dk=()=>{const t=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.t=t};
/* ---- UI helpers ---- */
const C=(h,c='')=>`<section class="card ${c}">${h}</section>`;
const ring=(p,l,sz=84)=>{const r=sz/2-8,c=2*Math.PI*r;return `<svg width="${sz}" height="${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--ln)" stroke-width="7"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--pu)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 ${sz/2} ${sz/2})" style="transition:stroke-dashoffset 1s"/><text x="50%" y="52%" text-anchor="middle" style="font-size:14px;fill:var(--tx)">${l}</text></svg>`};
const seg=(k,o)=>`<div class="seg">${o.map(x=>`<button class="${ui[k]==x[0]?'on':''}" onclick="ui.${k}='${x[0]}';R()">${x[1]}</button>`).join('')}</div>`;
const cl=()=>M.innerHTML='';
function ask(title,fs,cb,ok='Save',info=''){M.innerHTML=`<div class="ov" onclick="if(event.target==this)cl()"><form class="sheet" onsubmit="return false"><h3>${title}</h3>${info}${fs.map(f=>`<label>${f.l}${f.t=='area'?`<textarea id="f_${f.k}" rows="4" placeholder="${esc(f.p||'')}">${esc(f.v||'')}</textarea>`:f.t=='sel'?`<select id="f_${f.k}">${f.o.map(o=>`<option ${o==f.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(f.v||'')}" placeholder="${esc(f.p||'')}">`}</label>`).join('')}<div class="row"><button type="button" class="g" onclick="cl()">Cancel</button><button class="b sp" id="okb">${ok}</button></div></form></div>`;
document.getElementById('okb').onclick=()=>{const v={};fs.forEach(f=>v[f.k]=document.getElementById('f_'+f.k).value.trim());cl();cb(v)}}
function confetti(){const cs=['#B39DDB','#F4B6C9','#BFE6D4','#F9D5B8'];for(let i=0;i<26;i++){const e=document.createElement('i');e.className='cf';e.style.left=(30+Math.random()*40)+'%';e.style.background=cs[i%4];e.style.setProperty('--x',(Math.random()*200-100)+'px');e.style.setProperty('--y',(Math.random()*260-60)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}}
const R=()=>{dk();A.innerHTML=PG[ui.tab]();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==ui.tab));save_noflash=0};let save_noflash;
const go=t=>{ui.tab=t;scrollTo(0,0);R()};
const upd=(a,id,f)=>{const o=S[a].find(x=>x.id==id);if(o)f(o);save();R()};
const del=(a,id)=>{S[a]=S[a].filter(x=>x.id!=id);save();R()};
/* ---- Derived data ---- */
const streak=h=>{let n=0,d=new Date();if(!h.log.includes(ymd(d)))d=new Date(Date.now()-864e5);while(h.log.includes(ymd(d))){n++;d=new Date(d-864e5)}return n};
const best=()=>Math.max(0,...S.habits.map(streak));
const dayName=d=>new Date(d+'T00:00').toLocaleDateString('en',{weekday:'short'});
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()},tm=s=>{const[a,b]=s.split(':');return +a*60+ +b};
const top3=()=>S.tasks.filter(t=>!t.dd||t.dd==TD()).sort((a,b)=>['Urgent','Important','Can wait'].indexOf(a.p)-['Urgent','Important','Can wait'].indexOf(b.p)||(a.done?1:0)-(b.done?1:0)).slice(0,3);
const adv=e=>e<=3?'Gentle day. One small priority and a proper break.':e<=6?'Steady pace. Keep to your top three and pause between tasks.':e<=8?'Good energy. A fine moment for deep work.':'High energy. Use it well, and still leave room to rest.';
/* ---- Pages ---- */
const PG={};
PG.today=()=>{const h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening',e=S.energy[TD()]||5,t3=top3(),dn=t3.filter(t=>t.done).length;
const nd=S.tasks.filter(t=>!t.done&&t.due).sort((a,b)=>a.due<b.due?-1:1)[0],n=nowMin();
let cur=S.sched.find(s=>tm(s[0])<=n&&n<tm(s[1])),rn;if(cur){const a=tm(cur[0]),b=tm(cur[1]);rn=`<div class="lbl">Right now</div><h2 class="big">${esc(cur[2])} · ${cur[0]}-${cur[1]}</h2><div class="mu" style="color:#cbbddc">${b-n} min left</div><div class="bar" style="margin-top:12px"><i style="width:${(n-a)/(b-a)*100}%"></i></div>`}else{const nx=S.sched.find(s=>tm(s[0])>n);rn=`<div class="lbl">Right now</div><h2 class="big">Open space</h2><div class="mu" style="color:#cbbddc">${nx?'Next: '+esc(nx[2])+' at '+nx[0]:'Nothing scheduled. Rest well.'}</div>`}
const q=S.quotes[Math.floor(Date.now()/864e5)%S.quotes.length]||{t:'',a:''},sp=S.money.filter(m=>m.d==TD()&&m.ty=='out').reduce((a,m)=>a+m.a,0);
const all=S.tasks.filter(t=>t.dd==TD()).length,op=S.tasks.filter(t=>!t.done).length;
return `<div class="hd"><button class="av" onclick="go('me')">${esc((S.name||'R')[0].toUpperCase())}</button><div><h1>${g}, ${esc(S.name)}</h1><div class="mu">${new Date().toLocaleDateString('en',{weekday:'long',day:'numeric',month:'long'})}</div></div><span class="pill" id="pl">Saved ✓</span></div>
<div class="chips"><span class="chip">Next deadline · ${nd&&nd.due?dayName(nd.due):'none'}</span><span class="chip">Streak · ${best()} days</span><span class="chip">Energy ${e}/10 · ${e<=3?'Low':e<=6?'Steady':'High'}</span></div>
${C(`<div class="lbl">Energy check-in</div><div class="row"><input type="range" min="1" max="10" value="${e}" oninput="S.energy[TD()]=+this.value;save();this.nextElementSibling.textContent=this.value;document.getElementById('ad').textContent=adv(+this.value)"><b class="sf" style="font-size:26px">${e}</b></div><p id="ad" class="mu" style="background:var(--bg);border-radius:14px;padding:10px 14px;margin-top:8px">${adv(e)}</p>`)}
${C(rn+`<button class="g sm" style="margin-top:14px;color:#f6eefb" onclick="editSched()">Edit schedule</button>`,'dark')}
${C(`<div class="row"><h2 style="font-size:26px">Top 3 priorities</h2><span class="mu sp">${dn}/${t3.length} done</span></div>${t3.map((t,i)=>`<div class="it"><span class="n">${i+1}</span><span class="${t.done?'done':''}">${esc(t.t)}</span><button class="ck ${t.done?'on':''}" onclick="tg('${t.id}')">${t.done?'✓':''}</button></div>`).join('')||'<p class="mu">Nothing yet. Add one small task to begin.</p>'}`)}
${C(`<p class="q">“${esc(q.t)}”</p><p class="mu" style="margin-top:8px">${esc(q.a)}</p>`)}
<div class="row" style="margin-bottom:18px">${[['task','+ Task'],['note','+ Note'],['spend','+ Spending'],['mood','Mood Check-in']].map(x=>`<button class="g sm" onclick="quick('${x[0]}')">${x[1]}</button>`).join('')}</div>
${C(`<div class="row" style="justify-content:space-around;text-align:center">${ring(all?Math.round(S.tasks.filter(t=>t.dd==TD()).length/(all+op)*100):0,all+' done')}<div><div class="sf" style="font-size:30px">${best()}</div><div class="mu">day streak</div></div><div><div class="sf" style="font-size:22px">${rp(sp)}</div><div class="mu">spent today</div></div></div>`)}`};
function tg(id){const t=S.tasks.find(x=>x.id==id);t.done=!t.done;t.dd=t.done?TD():'';save();R();if(t.done&&top3().every(x=>x.done))confetti()}
function editSched(){ask('Daily schedule',[{k:'s',l:'One block per line: HH:MM-HH:MM Name',t:'area',v:S.sched.map(s=>`${s[0]}-${s[1]} ${s[2]}`).join('\n')}],v=>{S.sched=v.s.split('\n').map(l=>l.match(/^(\d\d:\d\d)-(\d\d:\d\d)\s+(.+)$/)).filter(Boolean).map(m=>[m[1],m[2],m[3]]);save();R()})}
/* ---- Plan ---- */
let pm={t:1500,iv:0};
function pmGo(){if(pm.iv){clearInterval(pm.iv);pm.iv=0;pm.t=1500;R();return}pm.iv=setInterval(()=>{pm.t--;const e=document.getElementById('pmt');if(e)e.textContent=pmf();if(pm.t<=0){clearInterval(pm.iv);pm.iv=0;pm.t=1500;S.focus.push({d:TD(),m:25});save();alert('Well done. Take a 5-minute break: stretch, drink water, look away from the screen.');R()}},1000);R()}
const pmf=()=>String(Math.floor(pm.t/60)).padStart(2,'0')+':'+String(pm.t%60).padStart(2,'0');
const nl=()=>S.notes.filter(n=>(ui.ms?(n.t+n.x+n.g).toLowerCase().includes(ui.ms.toLowerCase()):1)).sort((a,b)=>(b.pin||0)-(a.pin||0)).map(n=>`<div class="it" style="align-items:flex-start"><div><b>${n.pin?'📌 ':''}${esc(n.t)}</b> ${n.g?`<span class="tg w">${esc(n.g)}</span>`:''}${n.s?'<span class="tg c">sample</span>':''}<div class="mu">${esc(n.x)}</div></div><span class="sp row"><button class="g sm" onclick="upd('notes','${n.id}',o=>o.pin=o.pin?0:1)">Pin</button><button class="g sm" onclick="del('notes','${n.id}')">✕</button></span></div>`).join('')||'<p class="mu">No notes found.</p>';
PG.plan=()=>{let b='';if(ui.plan=='tasks'){const o=S.tasks.filter(t=>!t.done),dn=S.tasks.filter(t=>t.done);const row=t=>`<div class="it"><div><span class="${t.done?'done':''}">${esc(t.t)}</span><div><span class="tg ${t.p=='Urgent'?'':t.p=='Important'?'i':'c'}">${t.p}</span><span class="tg w">${t.c}</span>${t.due?`<span class="mu">${dayName(t.due)} ${t.due.slice(5)}</span>`:''}${t.s?' <span class="tg c">sample</span>':''}</div></div><span class="sp row"><button class="ck ${t.done?'on':''}" style="margin:0" onclick="tg('${t.id}')">${t.done?'✓':''}</button><button class="g sm" onclick="del('tasks','${t.id}')">✕</button></span></div>`;

${C(`<label>Name<input value="${esc(S.name)}" onchange="S.name=this.value.trim();save();R()"></label><div class="row"><button class="g sm" onclick="S.theme=document.documentElement.dataset.t=='dark'?'light':'dark';save();R()">Toggle dark mode</button><button class="g sm" onclick="exp()">Export data</button><label class="g sm" style="margin:0;cursor:pointer">Import<input type="file" accept=".json" hidden onchange="imp(this)"></label><button class="g sm" onclick="clr()">Clear sample data</button></div>`)}`};
function rem(){const q=S.quotes[Math.floor(Math.random()*S.quotes.length)];if(q)ask('A reminder',[],()=>{},'Close',`<p class="q">“${esc(q.t)}”</p><p class="mu">${esc(q.a)}</p>`)}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='resiliente-backup-'+TD()+'.json';a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tasks)throw 0;S=d;save();R()}catch(e){alert('That file doesn’t look like a Résiliente backup.')}};if(i.files[0])r.readAsText(i.files[0])}
function clr(){['tasks','notes','money','habits','goals','books'].forEach(k=>S[k]=S[k].filter(x=>!x.s));save();R()}
/* ---- Quick actions & shell ---- */
function quick(k){document.getElementById('fm').hidden=true;
if(k=='task')ask('New task',[{k:'t',l:'Task'},{k:'p',l:'Priority',t:'sel',o:['Urgent','Important','Can wait'],v:'Important'},{k:'c',l:'Category',t:'sel',o:['Work','Personal']},{k:'due',l:'Due (optional)',t:'date'}],v=>{if(v.t){S.tasks.push({id:uid(),t:v.t,p:v.p,c:v.c,due:v.due});save();R()}});
if(k=='note')ask('New note',[{k:'t',l:'Title'},{k:'x',l:'Note',t:'area'},{k:'g',l:'Tag',p:'number, procedure, idea…'}],v=>{if(v.t){S.notes.push({id:uid(),t:v.t,x:v.x,g:v.g,d:TD()});save();R()}});
if(k=='spend')ask('New entry',[{k:'a',l:'Amount (Rp)',t:'number'},{k:'c',l:'Category',t:'sel',o:[...EXP,...INC]},{k:'n',l:'Note'}],v=>{if(+v.a>0){S.money.push({id:uid(),d:TD(),ty:INC.includes(v.c)?'in':'out',a:+v.a,c:v.c,n:v.n});save();R()}});

if(k=='mood')moodSheet();
if(k=='dump')ask('Brain dump',[{k:'t',l:'What’s on your mind?',t:'area'}],v=>addDump(v.t))}
document.getElementById('fab').onclick=()=>{const f=document.getElementById('fm');f.hidden=!f.hidden;f.innerHTML=[['task','Task'],['note','Note'],['spend','Spending'],['mood','Mood Check-in'],['dump','Brain Dump']].map(x=>`<button onclick="quick('${x[0]}')">${x[1]}</button>`).join('')};
const IC={today:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',plan:'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',heal:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.500-7 10-7 10z"/>',grow:'<path d="M12 21v-9M12 12c0-4 3-6 7-6 0 4-3 6-7 6zM12 15c0-3-2-5-6-5 0 3 2 5 6 5z"/>',week:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'};
document.getElementById('nav').innerHTML=['today','plan','heal','grow','week'].map(t=>`<button data-t="${t}" onclick="go('${t}')"><svg viewBox="0 0 24 24">${IC[t]}</svg>${t[0].toUpperCase()+t.slice(1)}</button>`).join('');
/* Home-screen icon drawn on the fly (no external files) */
try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#B39DDB');g.addColorStop(1,'#F4B6C9');x.fillStyle=g;x.fillRect(0,0,180,180);x.fillStyle='#fff';x.font='600 110px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('R',90,98);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)}catch(e){}
dk();R();
setTimeout(()=>{const s=document.getElementById('sp');s.style.opacity=0;setTimeout(()=>s.remove(),1000)},1600);
if(!S.name)setTimeout(()=>ask('Welcome',[{k:'n',l:'What should I call you?'}],v=>{S.name=v.n||'friend';save();R()},'Begin'),1700);
